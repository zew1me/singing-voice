[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singing-voice"
version = "0.1.0"
description = "Librosa-powered audio preprocessing and stitching pipeline for Seed-VC workflows"
readme = "README.md"
authors = [
  { name = "Nigel Stuke" }
]
requires-python = ">=3.10"
dependencies = [
  "librosa>=0.10",
  "numpy>=1.24",
  "soundfile>=0.12",
  "typer>=0.9",
]

[project.optional-dependencies]
runpod = [
  "requests>=2.31"
]
# RunPod SDK 2.x pulls in FastAPI's OpenTelemetry exporter (protobuf>=5),
# which conflicts with Seed-VC's descript-audiotools (protobuf<3.20).
worker = [
  "runpod==1.9.1",
  "fastapi==0.135.4",
  "requests>=2.31",
]
# Model-based sections of `svtool score`: speaker-embedding timbre and Whisper words.
score = [
  "faster-whisper>=1.0",
  "speechbrain>=1.0",
  "torch>=2.1",
  "torchaudio>=2.1",
]

[project.scripts]
svtool = "singing_voice.cli:app"

[tool.uv]
managed = true
cache-dir = ".uv/cache"

[tool.uv.sources]
singing-voice = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
